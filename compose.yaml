services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dockerforge:0.2.0
    container_name: dockerforge-api
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql://dockerforge:dockerforge_dev@postgres:5432/dockerforge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dockerforge-network

  postgres:
    image: postgres:16
    container_name: dockerforge-postgres
    environment:
      POSTGRES_DB: dockerforge
      POSTGRES_USER: dockerforge
      POSTGRES_PASSWORD: dockerforge_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U dockerforge -d dockerforge",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - dockerforge-network

  redis:
    image: redis:7
    container_name: dockerforge-redis
    networks:
      - dockerforge-network

networks:
  dockerforge-network:
    driver: bridge

volumes:
  postgres-data:
