services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: dockerforge:0.2.0
    container_name: dockerforge-api
    environment:
      DATABASE_URL: postgresql://dockerforge:dockerforge_dev@postgres:5432/dockerforge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend
      - backend

  postgres:
    image: postgres:16
    container_name: dockerforge-postgres
    environment:
      POSTGRES_DB: dockerforge
      POSTGRES_USER: dockerforge
      POSTGRES_PASSWORD: dockerforge_dev
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U dockerforge -d dockerforge",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend

  redis:
    image: redis:7
    container_name: dockerforge-redis
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - backend

  nginx:
    image: nginx:alpine
    container_name: dockerforge-nginx
    ports:
      - "8088:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api:
        condition: service_started
    networks:
      - frontend

networks:
  frontend:
    driver: bridge

  backend:
    driver: bridge

volumes:
  postgres-data:
